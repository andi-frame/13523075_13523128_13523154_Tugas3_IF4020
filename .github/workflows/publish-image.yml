# Build the image and push it to the public Docker Hub repository
# docker.io/<DOCKERHUB_USERNAME>/zhongli. Tags vX.Y.Z must match pyproject.toml;
# the run summary shows the digest to pin in ci/pipeline.env.
# Needs the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN
# (a Docker Hub access token with read and write access).
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and version
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          : "${DOCKERHUB_USERNAME:?repository variable DOCKERHUB_USERNAME is not set}"
          image="docker.io/${DOCKERHUB_USERNAME}/zhongli"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match program version $version"
              exit 1
            fi
            tag="$version"
          else
            tag="dev-${GITHUB_SHA::12}"
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Smoke test the pushed image by digest, without credentials
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker logout docker.io
          docker image rm -f "$REF" 2>/dev/null || true
          docker pull "$REF"
          docker run --rm --network none --user "$(id -u):$(id -g)" "$REF" --version
          docker run --rm --network none --user "$(id -u):$(id -g)" "$REF" --help > /dev/null

      - name: Record image identity
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "| Program version | Source | Tag | Digest |"
            echo "| --- | --- | --- | --- |"
            echo "| ${{ steps.meta.outputs.version }} | \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA::12}\` | \`$IMAGE:$TAG\` | \`$DIGEST\` |"
            echo
            echo "Pin in \`ci/pipeline.env\`: \`IMAGE=$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
