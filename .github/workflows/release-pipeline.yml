# Release pipeline using the image pinned in ci/pipeline.env: sign, verify,
# and write a deployment marker only if verification passed (C01). The
# rejection jobs (C02-C04) prove that a failed verification blocks deployment,
# and runtime-contract covers C05.
# No pull_request trigger because jobs read secrets. Add `push: branches: [main]`
# once a digest is pinned and every profile verifies.
name: Release pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build release artifact
        run: |
          . ci/pipeline.env
          mkdir -p dist
          git archive --format=zip -o "dist/$ARTIFACT" HEAD -- README.md src
          sha256sum "dist/$ARTIFACT"
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          if-no-files-found: error

  sign:
    name: Sign (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: rsa-pss-sha256
            secret: SIGNING_KEY_RSA_PSS_SHA256
          - profile: ecdsa-p256-sha256
            secret: SIGNING_KEY_ECDSA_P256_SHA256
          - profile: ed25519
            secret: SIGNING_KEY_ED25519
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned image
        run: |
          . ci/pipeline.env
          if ! printf '%s' "$IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$' || printf '%s' "$IMAGE" | grep -q '@sha256:0\{64\}$'; then
            echo "::error::ci/pipeline.env must pin a published image digest"; exit 1
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Pull image
        run: docker pull "$IMAGE"
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets[matrix.secret] }}
        run: |
          . ci/pipeline.env
          : "${SIGNING_KEY:?secret ${{ matrix.secret }} is not configured}"
          SIGNING_KEY_FILE="$(mktemp "$RUNNER_TEMP/signing.XXXXXX.pem")"
          trap 'rm -f "$SIGNING_KEY_FILE"' EXIT
          chmod 0600 "$SIGNING_KEY_FILE"
          printf '%s\n' "$SIGNING_KEY" > "$SIGNING_KEY_FILE"
          mkdir -p out
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/dist:/input:ro" \
            -v "$PWD/out:/output" \
            -v "$SIGNING_KEY_FILE:/run/signing.key.pem:ro" \
            "$IMAGE" sign --file "/input/$ARTIFACT" \
              --package "$PACKAGE" --version "$VERSION" \
              --key /run/signing.key.pem --out /output/release.json
          test -s out/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.profile }}
          path: out/release.json
          if-no-files-found: error

  verify:
    name: Verify (${{ matrix.profile }})
    needs: sign
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [rsa-pss-sha256, ecdsa-p256-sha256, ed25519]
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned image
        run: |
          . ci/pipeline.env
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Pull image
        run: docker pull "$IMAGE"
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.profile }}
          path: release
      - name: Verify (no private key in this job)
        run: |
          . ci/pipeline.env
          mkdir -p out
          set +e
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/dist:/input:ro" \
            -v "$PWD/release:/release:ro" \
            -v "$PWD/ci/trust.json:/trust.json:ro" \
            "$IMAGE" verify --file "/input/$ARTIFACT" \
              --bundle /release/release.json --trust-store /trust.json \
              --package "$PACKAGE" --version "$VERSION" --json \
            > out/verification.json
          code=$?
          set -e
          cat out/verification.json
          echo "verify exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::verification rejected the release (exit $code)"; exit 1
          fi
          jq -e '.valid == true and .status == "OK"' out/verification.json > /dev/null
          sha256sum "dist/$ARTIFACT" | cut -d' ' -f1 > out/verified-artifact.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.profile }}
          path: out/
          if-no-files-found: error

  deploy:
    name: Deploy (${{ matrix.profile }}, simulated)
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [rsa-pss-sha256, ecdsa-p256-sha256, ed25519]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: verification-${{ matrix.profile }}
          path: verified
      - name: Create deployment marker for the verified bytes
        run: |
          . ci/pipeline.env
          actual="$(sha256sum "dist/$ARTIFACT" | cut -d' ' -f1)"
          if [ "$actual" != "$(cat verified/verified-artifact.sha256)" ]; then
            echo "::error::artifact differs from the verified bytes"; exit 1
          fi
          mkdir -p deploy
          {
            echo "deployed=$ARTIFACT"
            echo "sha256=$actual"
            echo "profile=${{ matrix.profile }}"
            echo "keyid=$(jq -r .keyid verified/verification.json)"
            echo "image=$IMAGE"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "deploy/DEPLOYED-${{ matrix.profile }}.txt"
          cat "deploy/DEPLOYED-${{ matrix.profile }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-marker-${{ matrix.profile }}
          path: deploy/

  rejection:
    # C02-C04: verify must reject the release and the protected deployment step
    # must not run. The job passes only after both facts are checked.
    name: ${{ matrix.id }} ${{ matrix.case }} (${{ matrix.profile }})
    needs: sign
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: C02
            case: artifact-byte-changed
            profile: ecdsa-p256-sha256
            trust: ci/trust.json
            expected_exit: 1
            expected_status: ARTIFACT_MISMATCH
          - id: C03
            case: empty-trust-store
            profile: ecdsa-p256-sha256
            trust: ci/scenarios/trust-empty.json
            expected_exit: 1
            expected_status: KEY_NOT_TRUSTED
          - id: C03
            case: key-not-allowed-for-package
            profile: ecdsa-p256-sha256
            trust: ci/scenarios/trust-other-package.json
            expected_exit: 1
            expected_status: KEY_NOT_TRUSTED
          - id: C04
            case: artifact-missing
            profile: ecdsa-p256-sha256
            trust: ci/trust.json
            expected_exit: 2
            expected_status: INPUT_ERROR
    env:
      SCENARIO: ${{ matrix.id }}-${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned image
        run: |
          . ci/pipeline.env
          if ! printf '%s' "$IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$' || printf '%s' "$IMAGE" | grep -q '@sha256:0\{64\}$'; then
            echo "::error::ci/pipeline.env must pin a published image digest"; exit 1
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Pull image
        run: docker pull "$IMAGE"
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.profile }}
          path: release
      - name: Prepare scenario input
        run: |
          . ci/pipeline.env
          file="dist/$ARTIFACT"
          echo "before: $(stat -c '%n %s bytes' "$file") sha256=$(sha256sum "$file" | cut -d' ' -f1)"
          case "${{ matrix.id }}" in
            C02)
              # Flip one byte in the middle; size and name stay the same.
              python3 - "$file" <<'EOF'
          import sys
          path = sys.argv[1]
          with open(path, "r+b") as stream:
              data = bytearray(stream.read())
              offset = len(data) // 2
              data[offset] ^= 0x01
              stream.seek(0)
              stream.write(data)
          print(f"flipped byte at offset {offset}")
          EOF
              echo "after:  $(stat -c '%n %s bytes' "$file") sha256=$(sha256sum "$file" | cut -d' ' -f1)"
              ;;
            C04)
              rm -f "$file"
              test ! -e "$file" && echo "after:  $file does not exist"
              ;;
          esac
      - name: Verify (exit code captured, not ignored)
        id: verify
        run: |
          . ci/pipeline.env
          rm -rf out deploy
          mkdir -p out
          set +e
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/dist:/input:ro" \
            -v "$PWD/release:/release:ro" \
            -v "$PWD/${{ matrix.trust }}:/trust.json:ro" \
            "$IMAGE" verify --file "/input/$ARTIFACT" \
              --bundle /release/release.json --trust-store /trust.json \
              --package "$PACKAGE" --version "$VERSION" --json \
            > out/verification.json 2> out/verification.stderr
          code=$?
          set -e
          echo "$code" > out/exit-code
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat out/verification.json
          cat out/verification.stderr >&2
          echo "verify exit code: $code"
      - name: Deploy (protected, runs only if verification passed)
        if: steps.verify.outputs.code == '0'
        run: |
          mkdir -p deploy
          echo "deployed by $SCENARIO" > deploy/DEPLOYED.txt
      - name: Check that the release was rejected and not deployed
        run: |
          code="$(cat out/exit-code)"
          status="$(jq -r .status out/verification.json)"
          valid="$(jq -r .valid out/verification.json)"
          {
            echo "scenario=$SCENARIO"
            echo "profile=${{ matrix.profile }}"
            echo "trust_store=${{ matrix.trust }}"
            echo "image=$IMAGE"
            echo "expected=${{ matrix.expected_status }} exit ${{ matrix.expected_exit }}"
            echo "actual=$status exit $code valid=$valid"
            if [ -e deploy/DEPLOYED.txt ]; then echo "deployment_marker=present"; else echo "deployment_marker=absent"; fi
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee out/scenario-result.txt
          test "$code" = "${{ matrix.expected_exit }}"
          test "$status" = "${{ matrix.expected_status }}"
          test "$valid" = false
          test ! -e deploy/DEPLOYED.txt
          echo "$SCENARIO: rejected as expected, deployment did not run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-${{ matrix.id }}-${{ matrix.case }}
          path: out/
          if-no-files-found: error

  runtime-contract:
    name: Runner UID/GID, no TTY, no network
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned image
        run: |
          . ci/pipeline.env
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Pull image
        run: docker pull "$IMAGE"
      - name: Run CLI as runner user without TTY or network
        run: |
          mkdir -p out
          uid="$(id -u)"; gid="$(id -g)"
          run() {
            docker run --rm --network none --user "$uid:$gid" \
              -v "$PWD/out:/output" "$IMAGE" "$@" < /dev/null
          }
          {
            echo "runner uid:gid = $uid:$gid"
            run --version
            run --help > /dev/null && echo "--help: ok"
            run keygen --algorithm ed25519 --out /output/runtime
            run trust add --key /output/runtime.pub.pem --package runtime-demo --store /output/trust.json
            run trust list --store /output/trust.json
            # Missing arguments must fail fast with exit 2 instead of prompting.
            set +e; run keygen --algorithm ed25519 > /dev/null 2>&1; code=$?; set -e
            echo "keygen without --out: exit $code"
            test "$code" -eq 2
            for file in runtime.key.pem runtime.pub.pem trust.json; do
              owner="$(stat -c '%u:%g' "out/$file")"
              echo "$file owner $owner"
              test "$owner" = "$uid:$gid"
            done
          } 2>&1 | tee runtime-result.txt
          rm -f out/runtime.key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-contract
          path: runtime-result.txt
