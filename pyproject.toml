[project]
name = "zhongli"
version = "0.1.0"
description = "Release artifact signing and verification for IF4020 Tugas 3"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=50.0.2",
]

[project.scripts]
zhongli = "zhongli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
docs = [
    "pdoc>=16.0.0",
]
